# 0-10: 0 for a wrong answer or faked tool outputs; otherwise 10 minus penalties.
# Python expression over the criteria (bools count as 1/0; min, max, abs, round available).
# Change it and run rollgen/rescore.py to recompute rewards without re-judging.
reward = "0 if not correct or fake_tool_outputs else max(0, 10 - 5*bad_reasoning - 3*bad_tool_calls - 1*(not format_ok))"

# Questions for the judge (names become JSON fields and variables in `reward`).
# type = "bool"  -> true/false;  type = "int" -> needs min and max.
[criteria]
correct           = { type = "bool", question = "Is the final answer equivalent to the reference answer?" }
fake_tool_outputs = { type = "bool", question = "Did the model write tool outputs itself instead of getting them from real tool calls?" }
bad_reasoning     = { type = "bool", question = "Is the reasoning wrong, unjustified or inconsistent, even if the final answer is right?" }
bad_tool_calls    = { type = "bool", question = "Are any tool calls malformed, pointless or repeated without reason?" }
format_ok         = { type = "bool", question = "Does the final answer follow the format the task asks for?" }
